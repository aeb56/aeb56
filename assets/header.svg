<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Abel-Emanuel Bancu — AI engineer, researcher, CTO at Optivise">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1414" stop-opacity="1" />
      <stop offset="60%" stop-color="#050507" stop-opacity="1" />
      <stop offset="100%" stop-color="#050507" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cf5c5" />
      <stop offset="50%" stop-color="#b8ffde" />
      <stop offset="100%" stop-color="#4fc89a" />
    </linearGradient>
    <linearGradient id="fadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cf5c5" stop-opacity="0" />
      <stop offset="50%" stop-color="#7cf5c5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7cf5c5" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7cf5c5" stroke-width="0.4" stroke-opacity="0.12" />
    </pattern>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#7cf5c5" fill-opacity="0.18" />
    </pattern>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="320" fill="url(#g1)" />
  <rect width="1200" height="320" fill="url(#grid)" />
  <rect width="1200" height="320" fill="url(#dots)" />

  <!-- Divider ribbon top -->
  <rect x="0" y="2" width="1200" height="1" fill="url(#fadeGrad)" />
  <rect x="0" y="317" width="1200" height="1" fill="url(#fadeGrad)" />

  <!-- Left-side drone silhouette (tiny quadrotor icon) -->
  <g transform="translate(110, 160)" opacity="0.95">
    <!-- arms -->
    <line x1="-46" y1="-46" x2="46" y2="46" stroke="#7cf5c5" stroke-width="2.4" stroke-linecap="round" />
    <line x1="46" y1="-46" x2="-46" y2="46" stroke="#7cf5c5" stroke-width="2.4" stroke-linecap="round" />
    <!-- body -->
    <rect x="-14" y="-10" width="28" height="20" rx="4" fill="#050507" stroke="#7cf5c5" stroke-width="2" />
    <circle cx="0" cy="0" r="3.2" fill="#b8ffde" filter="url(#glow)">
      <animate attributeName="r" values="2.5;4;2.5" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <!-- rotors -->
    <circle cx="-46" cy="-46" r="12" fill="none" stroke="#7cf5c5" stroke-width="1.6" stroke-opacity="0.8">
      <animate attributeName="stroke-dasharray" values="2 4; 20 4; 2 4" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="46" cy="-46" r="12" fill="none" stroke="#7cf5c5" stroke-width="1.6" stroke-opacity="0.8">
      <animate attributeName="stroke-dasharray" values="20 4; 2 4; 20 4" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="-46" cy="46" r="12" fill="none" stroke="#7cf5c5" stroke-width="1.6" stroke-opacity="0.8">
      <animate attributeName="stroke-dasharray" values="20 4; 2 4; 20 4" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="46" cy="46" r="12" fill="none" stroke="#7cf5c5" stroke-width="1.6" stroke-opacity="0.8">
      <animate attributeName="stroke-dasharray" values="2 4; 20 4; 2 4" dur="0.9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Trajectory curve (stylised training curve) -->
  <g transform="translate(220, 45)" opacity="0.85">
    <path d="M 0 200 C 120 200, 180 180, 240 140 S 400 50, 520 30" fill="none" stroke="url(#mintGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />
    <!-- tick marks -->
    <g stroke="#7cf5c5" stroke-opacity="0.4" stroke-width="1">
      <line x1="0" y1="205" x2="0" y2="215" />
      <line x1="130" y1="205" x2="130" y2="215" />
      <line x1="260" y1="205" x2="260" y2="215" />
      <line x1="390" y1="205" x2="390" y2="215" />
      <line x1="520" y1="205" x2="520" y2="215" />
    </g>
    <!-- marker dot -->
    <circle cx="520" cy="30" r="4" fill="#b8ffde" filter="url(#glow)">
      <animate attributeName="cy" values="30;28;30" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="524" y="24" font-family="JetBrains Mono, monospace" font-size="10" fill="#7cf5c5" opacity="0.8">reward ↑</text>
    <text x="0" y="230" font-family="JetBrains Mono, monospace" font-size="9" fill="#7cf5c5" opacity="0.55">episodes →</text>
  </g>

  <!-- Main wordmark -->
  <g transform="translate(220, 135)">
    <text x="0" y="0" font-family="Georgia, 'Instrument Serif', serif" font-size="58" fill="#f5f5f0" font-weight="400">
      Abel-Emanuel Bancu
    </text>
    <text x="4" y="36" font-family="JetBrains Mono, monospace" font-size="16" fill="#7cf5c5" letter-spacing="1">
      ai engineer · researcher · cto
    </text>
    <text x="4" y="62" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#d4d4d8" opacity="0.85">
      behaviour-first robot navigation · low-hallucination AI · agents that actually move like they mean it
    </text>
  </g>

  <!-- Right-side spec block -->
  <g transform="translate(930, 70)" font-family="JetBrains Mono, monospace" font-size="11" fill="#7cf5c5">
    <rect x="-10" y="-20" width="240" height="170" fill="#050507" fill-opacity="0.6" stroke="#7cf5c5" stroke-opacity="0.35" stroke-width="1" rx="6" />
    <text x="0" y="0" fill="#b8ffde" font-size="10" opacity="0.7">// spec.json</text>
    <text x="0" y="20" fill="#d4d4d8">{</text>
    <text x="14" y="36" fill="#d4d4d8">role<tspan fill="#7cf5c5">:</tspan> <tspan fill="#b8ffde">"CTO + researcher"</tspan>,</text>
    <text x="14" y="52" fill="#d4d4d8">msc<tspan fill="#7cf5c5">:</tspan>  <tspan fill="#b8ffde">"Distinction, City"</tspan>,</text>
    <text x="14" y="68" fill="#d4d4d8">phd<tspan fill="#7cf5c5">:</tspan>  <tspan fill="#b8ffde">"incoming, Kent"</tspan>,</text>
    <text x="14" y="84" fill="#d4d4d8">stack<tspan fill="#7cf5c5">:</tspan> <tspan fill="#b8ffde">["PPO", "Claude",</tspan></text>
    <text x="54" y="100" fill="#b8ffde">"PyTorch", "TS"],</text>
    <text x="14" y="116" fill="#d4d4d8">loc<tspan fill="#7cf5c5">:</tspan>   <tspan fill="#b8ffde">"London / UK"</tspan>,</text>
    <text x="14" y="132" fill="#d4d4d8">status<tspan fill="#7cf5c5">:</tspan> <tspan fill="#b8ffde">"shipping"</tspan></text>
    <text x="0" y="148" fill="#d4d4d8">}</text>
  </g>

  <!-- Bottom status line -->
  <g transform="translate(40, 295)" font-family="JetBrains Mono, monospace" font-size="10" fill="#7cf5c5" opacity="0.7">
    <circle cx="0" cy="-3" r="3" fill="#7cf5c5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="0">policy_update 2026.04 · gradient_norm = 0.91 · loss ↓ · let's go.</text>
  </g>
</svg>
